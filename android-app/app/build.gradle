plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whatamesss.sensorbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whatamesss.sensorbridge'
        minSdk 27
        targetSdk 27
        versionCode 3
        versionName '1.2'
    }

    // Pin the debug signing key to a copy checked in with the project. Without
    // this, AGP looks for debug.keystore in a user-home location and silently
    // mints a new key whenever it is missing, which changes the signature and
    // blocks in-place updates on the device.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
}
