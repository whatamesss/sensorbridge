plugins {
    id 'com.android.application'
}

// Release signing lives outside the repository: an untracked keystore.properties
// at the repository root, or the SENSORBRIDGE_* environment variables. See
// "Signing a release" in the README.
def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')

if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

def releaseSetting = { String envName, String propertyName ->
    System.getenv(envName) ?: releaseSigning.getProperty(propertyName)
}

// Gradle resolves relative paths against the project, but Java does not expand
// a leading "~". Accept "~/keys/..." from keystore.properties as the user's
// home directory rather than a literal directory named "~".
def expandTilde = { String path ->
    if (path != null && (path == '~' || path.startsWith('~/'))) {
        return System.getProperty('user.home') + path.substring(1)
    }

    return path
}

def releaseStoreFile =
    expandTilde(releaseSetting('SENSORBRIDGE_KEYSTORE', 'storeFile'))
def releaseStorePassword =
    releaseSetting('SENSORBRIDGE_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = releaseSetting('SENSORBRIDGE_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword =
    releaseSetting('SENSORBRIDGE_KEY_PASSWORD', 'keyPassword')

android {
    namespace 'com.whatamesss.sensorbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whatamesss.sensorbridge'
        minSdk 27
        targetSdk 27
        versionCode 3
        versionName '1.2'
    }

    // Pin the debug signing key to a copy checked in with the project. Without
    // this, AGP looks for debug.keystore in a user-home location and silently
    // mints a new key whenever it is missing, which changes the signature and
    // blocks in-place updates on the device. Release builds are signed with a
    // private key that is not part of the repository.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // This app is published as a signed APK in GitHub releases, not through
        // Google Play, so the Play target-API policy does not apply. targetSdk 27
        // is deliberate for the Android 8.1 device it runs on; moving to 31+
        // would also require the BLUETOOTH_SCAN/BLUETOOTH_CONNECT runtime
        // permission flow, which this build does not implement.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    testImplementation 'junit:junit:4.13.2'
}
